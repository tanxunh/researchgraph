[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra -m "not evaluation_private"
markers =
    evaluation_private: requires non-public V2 evaluation artifacts
    integration: tests that exercise DB, Chroma, indexing, graph persistence, and retrieval together
    migration: forward migration on empty and existing application schemas
